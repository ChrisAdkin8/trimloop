<svg xmlns="http://www.w3.org/2000/svg" width="840" height="572" viewBox="0 0 840 572" role="img" aria-labelledby="title desc">
<title id="title">Trimloop architecture: today and planned</title>
<desc id="desc">On the developer machine, a coding agent such as Claude Code sends requests through Trimloop taps to the model providers. The taps feed a normaliser, a local store and the detectors, which turn 19 waste patterns into findings: a report and nudges. Actuators apply the safe fixes, to config files or to requests in the taps. Findings go to an optional team collector as hashes, counts and cost, never source code; a gateway sidecar beside LiteLLM feeds it too. The collector ranks recommendations and serves a team dashboard. Boxes marked M0 are in today's prototype in part: log reading, the detectors and the report and nudges.</desc>
