<svg xmlns="http://www.w3.org/2000/svg" width="680" height="600" viewBox="0 0 680 600" role="img" aria-labelledby="title desc">
<title id="title">Trimloop high-level architecture</title>
<desc id="desc">On the developer machine, coding agents send traffic through Trimloop taps to model providers. Taps feed a normaliser, a local DuckDB store, detectors and actuators, which push fixes back into the proxy. Detectors send hashes-only findings to an optional team collector, which also ingests gateway logs, ranks recommendations and serves a team dashboard.</desc>
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  .th { font-size: 14px; font-weight: 500; }
  .ts { font-size: 12px; font-weight: 400; }
  .ext rect { fill: #FFFFFF; stroke: #888780; }
  .ext .th { fill: #2C2C2A; } .ext .ts { fill: #5F5E5A; }
  .comp rect { fill: #E1F5EE; stroke: #0F6E56; }
  .comp .th { fill: #085041; } .comp .ts { fill: #0F6E56; }
  .zone rect { fill: #EEEDFE; stroke: #534AB7; }
  .zone .th { fill: #3C3489; } .zone .ts { fill: #534AB7; }
  .arr { stroke: #73726C; stroke-width: 1.5; fill: none; }
  .head { stroke: #73726C; }
  @media (prefers-color-scheme: dark) {
    .ext rect { fill: #2C2C2A; stroke: #888780; }
    .ext .th { fill: #F1EFE8; } .ext .ts { fill: #B4B2A9; }
    .comp rect { fill: #085041; stroke: #5DCAA5; }
    .comp .th { fill: #9FE1CB; } .comp .ts { fill: #5DCAA5; }
    .zone rect { fill: #26215C; stroke: #AFA9EC; }
    .zone .th { fill: #CECBF6; } .zone .ts { fill: #AFA9EC; }
    .arr, .head { stroke: #9C9A92; }
  }
</style>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path class="head" d="M2 1L8 5L2 9" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<g class="ext">
