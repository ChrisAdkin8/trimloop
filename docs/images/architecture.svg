  <text class="ts" x="142" y="442" text-anchor="middle" dominant-baseline="central">Hashes, counts, cost</text>
</g>
<g class="comp">
  <rect x="257" y="404" width="165" height="56" rx="8" stroke-width="0.5"/>
  <text class="th" x="340" y="422" text-anchor="middle" dominant-baseline="central">Recommendations</text>
  <text class="ts" x="340" y="442" text-anchor="middle" dominant-baseline="central">Ranked by saving</text>
</g>
