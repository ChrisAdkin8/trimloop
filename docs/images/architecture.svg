  <text class="th" x="537" y="42" text-anchor="middle" dominant-baseline="central">Model providers</text>
</g>

<g class="zone">
  <rect x="40" y="90" width="600" height="225" rx="20" stroke-width="0.5"/>
  <text class="th" x="60" y="114">Developer machine</text>
  <text class="ts" x="620" y="114" text-anchor="end">Raw content stays here</text>
</g>

<g class="ext">
  <rect x="60" y="134" width="165" height="56" rx="8" stroke-width="0.5"/>
  <text class="th" x="142" y="152" text-anchor="middle" dominant-baseline="central">Coding agent</text>
  <text class="ts" x="142" y="172" text-anchor="middle" dominant-baseline="central">Claude Code, Codex</text>
</g>
<g class="comp">
  <rect x="257" y="134" width="165" height="56" rx="8" stroke-width="0.5"/>
  <text class="th" x="340" y="152" text-anchor="middle" dominant-baseline="central">Taps</text>
  <text class="ts" x="340" y="172" text-anchor="middle" dominant-baseline="central">Proxy, OTel, logs</text>
</g>
<g class="comp">
  <rect x="455" y="134" width="165" height="56" rx="8" stroke-width="0.5"/>
  <text class="th" x="537" y="152" text-anchor="middle" dominant-baseline="central">Normaliser</text>
  <text class="ts" x="537" y="172" text-anchor="middle" dominant-baseline="central">Redact, fingerprint</text>
</g>

<g class="comp">
  <rect x="60" y="230" width="165" height="56" rx="8" stroke-width="0.5"/>
  <text class="th" x="142" y="248" text-anchor="middle" dominant-baseline="central">Actuators</text>
  <text class="ts" x="142" y="268" text-anchor="middle" dominant-baseline="central">Patch, transform</text>
</g>
