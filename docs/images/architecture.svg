  <text class="th" x="340" y="248" text-anchor="middle" dominant-baseline="central">Detectors</text>
  <text class="ts" x="340" y="268" text-anchor="middle" dominant-baseline="central">18 waste patterns</text>
</g>
<g class="comp">
