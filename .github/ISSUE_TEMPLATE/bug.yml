name: Something does not work
description: A crash, an error, or the install, plugin, status line or hooks not working
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        For a number that looks wrong, use "A figure looks wrong" instead.
        For a security problem, do not open an issue: see SECURITY.md.

        **Before you paste anything:** reports and logs can show your project
        names, session titles and code. Paste only the error and the lines
        around it.
  - type: input
    id: version
    attributes:
      label: trimloop version
      description: The output of `trimloop --version`
      placeholder: trimloop v0.2.0
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: System and how you installed it
      placeholder: macOS 15 on Apple silicon, Homebrew
    validations:
      required: true
  - type: textarea
    id: did
    attributes:
      label: What you ran
      render: text
    validations:
      required: true
  - type: textarea
    id: happened
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: setup
    attributes:
      label: For the status line or hooks, the output of `trimloop setup --check`
      render: text
