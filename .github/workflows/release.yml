# Builds and publishes a draft release when a version tag (v1.2.3) is pushed.
# See .goreleaser.yaml and ADR 0047. Actions are pinned to commits; the
# comment gives the release each commit is.
name: release

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write # create the draft release
      id-token: write # keyless signing (cosign) and provenance
      attestations: write # build provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # GoReleaser needs the tags for the changelog
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false # a release builds from a clean state

      - name: Test
        run: go test -race ./...

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.4

      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3

      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.19.0
          # Without a tap token, build everything except the Homebrew cask.
          # While the repository is private, skip the keyless signature: it
          # would publish the repository's name in Sigstore's public log.
          args: >-
            release --clean
            ${{ secrets.HOMEBREW_TAP_TOKEN == '' && '--skip=homebrew' || '' }}
            ${{ github.event.repository.private && '--skip=sign' || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}

      # Attestations for private repositories need a paid GitHub plan, so
      # provenance is added once the repository is public.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: ${{ !github.event.repository.private }}
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.rpm
